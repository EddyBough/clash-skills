name: Experimental passage ranking benchmark

on:
  push:
    paths:
      - "experiments/passage_ranking.py"
      - "tests/fixtures/passage_benchmark.json"
      - "tests/test_passage_ranking.py"
      - ".github/workflows/passage-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compare metadata and passage ranking
        run: python experiments/passage_ranking.py --summary-only --top-k 5,10,20
