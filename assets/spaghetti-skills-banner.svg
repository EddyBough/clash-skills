<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="336" viewBox="0 0 1280 336" role="img" aria-labelledby="title desc">
  <title id="title">SpaghettiSkills — audit Agent Skills before they conflict</title>
  <desc id="desc">Dark technical banner: SpaghettiSkills on the left, two skill instruction cards converging into an evidence check on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#0A0F19"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#273346" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="23"/>
    </filter>
  </defs>

  <rect width="1280" height="336" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="336" rx="22" fill="url(#grid)"/>
  <circle cx="1053" cy="145" r="128" fill="#F97316" opacity="0.055" filter="url(#glow)"/>
  <path d="M0 1H1280" stroke="#344052" opacity=".8"/>
  <rect x="0" y="0" width="7" height="336" rx="3.5" fill="url(#signal)"/>

  <rect x="66" y="43" width="9" height="9" rx="2" fill="#FB923C"/>
  <text x="88" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#A7B5CA">OPEN SOURCE  /  AGENT SKILL AUDITOR</text>

  <text x="64" y="133" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="63" font-weight="750" letter-spacing="-2" fill="#F8FAFC">Spaghetti</text>
  <text x="64" y="203" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="63" font-weight="750" letter-spacing="-2" fill="#FB923C">Skills</text>
  <text x="67" y="252" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#C9D4E3">Know when your agent skills disagree.</text>

  <rect x="66" y="276" width="123" height="31" rx="15.5" fill="#172338" stroke="#32445D"/>
  <text x="127.5" y="296" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#C5D4E6">READ-ONLY</text>
  <rect x="200" y="276" width="167" height="31" rx="15.5" fill="#172338" stroke="#32445D"/>
  <text x="283.5" y="296" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#C5D4E6">EVIDENCE-BASED</text>

  <path d="M751 50V291" stroke="#354255" opacity=".65"/>

  <rect x="793" y="63" width="181" height="75" rx="12" fill="#172438" stroke="#485971"/>
  <rect x="811" y="82" width="10" height="10" rx="3" fill="#38BDF8"/>
  <text x="829" y="92" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#F1F5F9">SKILL A</text>
  <text x="812" y="118" font-family="ui-monospace, monospace" font-size="12.5" fill="#A9BCD3">global / rules</text>

  <rect x="1010" y="63" width="181" height="75" rx="12" fill="#172438" stroke="#485971"/>
  <rect x="1028" y="82" width="10" height="10" rx="3" fill="#A78BFA"/>
  <text x="1046" y="92" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#F1F5F9">SKILL B</text>
  <text x="1029" y="118" font-family="ui-monospace, monospace" font-size="12.5" fill="#A9BCD3">project / rules</text>

  <path d="M883 138V157C883 172 909 181 969 197" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1100 138V157C1100 172 1069 181 996 197" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="982" cy="195" r="19" fill="#372419" stroke="#FB923C" stroke-width="1.7"/>
  <path d="M974 187L990 203M990 187L974 203" stroke="#FB923C" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M982 214V233" stroke="#FB923C" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="852" y="234" width="261" height="67" rx="12" fill="#2C211C" stroke="#BF622A"/>
  <circle cx="876" cy="260" r="6" fill="#FB923C"/>
  <text x="891" y="264" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#FFB77B">REVIEW + EVIDENCE</text>
  <text x="877" y="284" font-family="ui-monospace, monospace" font-size="12.5" fill="#D5BEAB">Traceable verdict, no auto-fix</text>
</svg>